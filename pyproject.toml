[project]
name = "ap2-bounded-restocking-agent"
version = "0.1.0"
description = "AP2-Bounded Autonomous B2B Supply Chain Restocking Agent (Razorpay Buildathon)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "cryptography>=42",
    "base58>=2.1",
    "mcp>=1.2",
    "litellm>=1.40",
    "langgraph>=0.2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]